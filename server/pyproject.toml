[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minesweeper-mirror-server"
version = "0.1.0"
description = "Local companion server for the Minesweeper Mirror Chrome extension"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "pynput>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
minesweeper-server = "minesweeper_mirror.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["minesweeper_mirror"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
